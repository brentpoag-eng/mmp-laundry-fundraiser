<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMP Laundry Fundraiser</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2f1a4d">
<style>
  :root {
    --blue: #2f5d9b; --blue-soft: #dbe6f4; --green-soft: #e2efcf; --ink: #17202e; --muted: #5b6678;
    --line: #cfd8e5; --bg: #f3f6fa; --card: #fff; --danger: #b3261e; --ok: #1f7a3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); padding-bottom: 96px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header.top { text-align: center; padding: 52px 8px 8px; }
  header.top h1 { margin: 0 0 4px; font-size: 1.5rem; color: var(--blue); }
  header.top p { margin: 2px 0; color: var(--muted); }
  header.top .support { color: var(--ink); font-weight: 600; font-style: italic; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; }
  .card h2 { margin: 0 0 10px; font-size: 1.05rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 10px 0 4px; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=tel], input[type=email] {
    width: 100%; padding: 11px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  .grid2 { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .cat { padding: 0; overflow: hidden; }
  .cat { scroll-margin-top: 12px; }
  .cat-head { display: flex; gap: 14px; align-items: center; background: var(--blue-soft); padding: 12px 16px; }
  .pic { flex: none; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .ttl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ttl h3 { margin: 0; font-size: 1.08rem; }
  .blurb { margin: 4px 0 0; font-size: .85rem; color: #34425a; line-height: 1.35; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 6px -2px 0; scrollbar-width: thin; }
  .chip { flex: none; text-decoration: none; color: var(--blue); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; white-space: nowrap; }
  .chip b { color: var(--ink); margin-left: 2px; }
  @media (max-width: 420px) { .pic { width: 64px; height: 64px; } .cat-head { gap: 10px; padding: 12px; } }
  .price { background: var(--blue); color: #fff; border-radius: 999px; padding: 2px 12px; font-size: .95rem; }
  .group { padding: 10px 16px 4px; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-top: 1px solid #eef2f7; }
  .row .name { flex: 1; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 1.25rem; line-height: 1; color: var(--blue); cursor: pointer; }
  .stepper button:active { background: var(--blue-soft); }
  .stepper input { width: 52px; text-align: center; padding: 8px 4px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  .row.has .name { font-weight: 600; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px; box-shadow: 0 -4px 14px rgba(20,40,80,.08); }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sum { line-height: 1.2; } .sum b { font-size: 1.25rem; } .sum small { color: var(--muted); display: block; }
  .btn { background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 13px 22px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn.ghost { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
  .err { color: var(--danger); font-weight: 600; margin: 10px 0 0; min-height: 1.2em; }
  .foot { font-size: .78rem; color: var(--muted); text-align: center; margin: 22px 4px; }
  .logo { display: block; margin: 0 auto 10px; width: 150px; height: 150px; border-radius: 18px; box-shadow: 0 4px 16px rgba(47,26,77,.35); }
  .admin-link { position: absolute; top: 12px; right: 12px; font-size: .8rem; font-weight: 600; color: var(--blue); text-decoration: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; }
  .admin-link:hover, .admin-link:focus-visible { background: var(--blue-soft); }
  .wrap { position: relative; }
  .done h2 { color: var(--ok); }
  .done a { color: var(--blue); }
  .done .venmo-btn { display: block; text-align: center; text-decoration: none; background: #3d95ce; color: #fff; font-size: 1.1rem; padding: 15px 18px; border-radius: 12px; margin: 14px 0 4px; }
  .done .venmo-note { margin: 6px 0 14px; font-size: .88rem; color: var(--muted); text-align: center; }
  .done ul { padding-left: 20px; margin: 8px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="admin-link" href="/admin.html">Admin login</a>
  <header class="top">
    <img class="logo" src="/logo.png" width="150" height="150" alt="Wheels Within Wheels, MMP 26">
    <h1 id="org"></h1>
    <p class="support" id="supporting"></p>
    <p id="period"></p>
  </header>

  <form id="form" novalidate autocomplete="on">
    <div class="card">
      <h2>Your info</h2>
      <div class="grid2">
        <div><label for="customerName">Your name</label>
          <input id="customerName" type="text" maxlength="60" autocomplete="name" required></div>
        <div><label for="phone">Phone</label>
          <input id="phone" type="tel" maxlength="16" placeholder="(812) 555-0123" autocomplete="tel" inputmode="tel" required></div>
        <div><label for="email">Email <span class="opt">(optional)</span></label>
          <input id="email" type="email" maxlength="80" autocomplete="email"></div>
      </div>
      <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>

    <div id="catalog"></div>

    <p class="err" id="err" role="alert"></p>
    <p class="foot" id="footnote"></p>
  </form>

  <div class="card done hidden" id="done"></div>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="sum"><b id="total">$0</b><small id="count">0 items</small></div>
    <button class="btn" id="submit" type="button">Place order</button>
  </div>
</div>

<script type="module">
import { site, products, formatPhone, sections, shortGroup } from "/catalog.js";

const $ = (id) => document.getElementById(id);
const qty = new Array(products.length).fill(0);
const rows = [];

$("org").textContent = site.title;
$("supporting").textContent = "Thank you for supporting: " + site.supporting;
$("period").textContent = "Seller: " + site.seller + " • Sale period: " + site.salePeriod + " • " + site.deliveryNote;
$("footnote").textContent = site.footnote;
document.title = site.title;


function update() {
  const units = qty.reduce((s, q) => s + q, 0);
  const total = qty.reduce((s, q, i) => s + q * products[i].price, 0);
  $("total").textContent = "$" + total;
  $("count").textContent = units + (units === 1 ? " item" : " items");
  rows.forEach((r, i) => { r.input.value = qty[i]; r.el.classList.toggle("has", qty[i] > 0); });
}
function setQty(i, v) {
  const n = Math.max(0, Math.min(99, Math.floor(Number(v)) || 0));
  qty[i] = n; update();
}

const STAIN_ICON = '<svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path d="M14 22h36l-3 34a4 4 0 0 1-4 4H21a4 4 0 0 1-4-4z" fill="#fff" stroke="#2f5d9b" stroke-width="3"/><path d="M12 22c0-6 8-10 20-10s20 4 20 10" fill="#dbe6f4" stroke="#2f5d9b" stroke-width="3"/><circle cx="32" cy="40" r="6" fill="#2f5d9b"/></svg>';

const chips = document.createElement("nav");
chips.className = "chips"; chips.setAttribute("aria-label", "Jump to a product");

for (const sec of sections) {
  const items = [];
  for (const g of sec.groups) products.forEach((p, i) => { if (p.group === g.group) items.push({ p, i, label: g.label }); });
  if (!items.length) continue;
  const price = items[0].p.price;

  const chip = document.createElement("a");
  chip.href = "#" + sec.id; chip.className = "chip";
  chip.append(document.createTextNode(sec.chip + " "), Object.assign(document.createElement("b"), { textContent: "$" + price }));
  chips.append(chip);

  const card = document.createElement("section");
  card.className = "card cat"; card.id = sec.id;

  const head = document.createElement("div"); head.className = "cat-head";
  const pic = document.createElement("div"); pic.className = "pic";
  if (sec.image) { const im = document.createElement("img"); im.src = sec.image; im.alt = ""; im.width = 84; im.height = 84; im.loading = "lazy"; pic.append(im); }
  else pic.innerHTML = STAIN_ICON;
  const info = document.createElement("div"); info.className = "info";
  const ttl = document.createElement("div"); ttl.className = "ttl";
  const t = document.createElement("h3"); t.textContent = sec.title;
  const pr = document.createElement("span"); pr.className = "price"; pr.textContent = "$" + price + " each";
  ttl.append(t, pr);
  const bl = document.createElement("p"); bl.className = "blurb"; bl.textContent = sec.blurb;
  info.append(ttl, bl); head.append(pic, info); card.append(head);

  let lastGroup = null;
  for (const { p, i, label } of items) {
    if (label && p.group !== lastGroup) {
      const g = document.createElement("div"); g.className = "group"; g.textContent = label; card.append(g);
    }
    lastGroup = p.group;
    const row = document.createElement("div"); row.className = "row";
    const name = document.createElement("span"); name.className = "name"; name.textContent = p.name;
    const st = document.createElement("div"); st.className = "stepper";
    const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "\u2212"; minus.setAttribute("aria-label", "Remove one " + p.name);
    const input = document.createElement("input"); input.type = "text"; input.inputMode = "numeric"; input.value = "0"; input.setAttribute("aria-label", "Quantity " + p.name);
    const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "Add one " + p.name);
    minus.onclick = () => setQty(i, qty[i] - 1);
    plus.onclick = () => setQty(i, qty[i] + 1);
    input.onchange = () => setQty(i, input.value);
    input.onfocus = () => input.select();
    st.append(minus, input, plus); row.append(name, st); card.append(row);
    rows[i] = { el: row, input };
  }
  $("catalog").append(card);
}
$("catalog").before(chips);
update();

$("phone").addEventListener("input", (e) => { e.target.value = formatPhone(e.target.value); });

const btn = $("submit"), err = $("err");
btn.onclick = async () => {
  err.textContent = "";
  const body = {
    customerName: $("customerName").value, phone: $("phone").value,
    email: $("email").value, website: $("website").value, qty,
  };
  if (!body.customerName.trim()) return fail("Please enter your name.", "customerName");
  if (formatPhone(body.phone).replace(/\D/g, "").length !== 10) return fail("Please enter a valid 10-digit phone number.", "phone");
  if (!qty.some((q) => q > 0)) return fail("Add at least one item to your order.");

  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const res = await fetch("/api/submit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    showDone(body);
  } catch (e) {
    fail(e.message);
    btn.disabled = false; btn.textContent = "Place order";
  }
};
function fail(msg, focusId) { err.textContent = msg; if (focusId) $(focusId).focus(); }

function showDone(body) {
  const total = qty.reduce((s, q, i) => s + q * products[i].price, 0);
  const done = $("done");
  done.replaceChildren();
  const h = document.createElement("h2"); h.textContent = "Thank you, order received!";
  const p = document.createElement("p");
  p.textContent = `${body.customerName.trim()}, your order for ${site.seller} is in. Total: $${total}.`;
  const ul = document.createElement("ul");
  qty.forEach((q, i) => { if (q > 0) { const li = document.createElement("li"); li.textContent = `${q} × ${shortGroup(products[i].group)}: ${products[i].name}`; ul.append(li); } });
  const pay = document.createElement("p");
  if (site.payableTo) pay.textContent = `Please make checks payable to: ${site.payableTo}.`;
  else pay.hidden = true;
  const venmo = document.createElement("div");
  venmo.className = "venmo";
  if (site.venmoUser) {
    const note = `${site.title} - ${body.customerName.trim()}`;
    const vb = document.createElement("a");
    vb.className = "btn venmo-btn";
    vb.href = "https://venmo.com/?" + new URLSearchParams({ txn: "pay", audience: "private", recipients: site.venmoUser, amount: String(total), note }).toString();
    vb.target = "_blank"; vb.rel = "noopener";
    vb.textContent = `Pay $${total} with Venmo`;
    const vn = document.createElement("p");
    vn.className = "venmo-note";
    vn.append(`Pays @${site.venmoUser} with the note "${note}". `);
    if (site.venmoUrl) {
      const fb = document.createElement("a");
      fb.href = site.venmoUrl; fb.target = "_blank"; fb.rel = "noopener"; fb.textContent = "Button not working?";
      vn.append(fb);
    }
    venmo.append(vb, vn);
  }
  const ask = document.createElement("p");
  ask.append(site.venmoUrl ? "Prefer cash or check? Please call or text " : "To coordinate payment, please call or text ");
  site.contacts.forEach((c, i) => {
    const a = document.createElement("a");
    a.href = "tel:+1" + c.phone; a.textContent = formatPhone(c.phone); a.style.fontWeight = "700";
    if (i) ask.append(i === site.contacts.length - 1 ? " or " : ", ");
    ask.append(c.name + " at ", a);
  });
  ask.append(".");
  const again = document.createElement("button"); again.className = "btn ghost"; again.type = "button"; again.textContent = "Place another order";
  again.onclick = () => { qty.fill(0); update(); $("customerName").value = ""; $("phone").value = ""; $("email").value = ""; $("done").classList.add("hidden"); $("form").classList.remove("hidden"); $("bar").classList.remove("hidden"); btn.disabled = false; btn.textContent = "Place order"; window.scrollTo(0, 0); };
  done.append(h, p, ul, venmo, pay, ask, again);
  $("form").classList.add("hidden"); $("bar").classList.add("hidden"); done.classList.remove("hidden");
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
